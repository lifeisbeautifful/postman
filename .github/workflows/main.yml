name: Automated API tests using Postman CLI

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Додає кнопку ручного запуску

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key $PM_API_KEY
        env:
          PM_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      - name: Run API tests
        run: |
          postman collection run "5963765-2a5432ed-3ddb-4e7a-ac00-dc4beff48357" \
          -e "5963765-869cd8ae-fc16-4141-97b4-1a909da3038d" \
          --env-var "baseUrl=${{ secrets.BASE_URL }}" \
          -r cli,html --reporter-html-export index.html

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: index.html

      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: . # папка, де лежить report.html
          destination_dir: docs # (Опціонально) щоб звіт лежав у папці docs на сайті
